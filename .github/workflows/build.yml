name: Build AetherHUD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # This action handles gradle wrapper automatically — no wrapper jar needed in repo
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
          # Cache gradle dependencies and build outputs
          cache-read-only: false

      # Cache fabric/minecraft dependencies separately (they're huge)
      - name: Cache Minecraft Assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
          key: mc-${{ runner.os }}-1.21.4-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            mc-${{ runner.os }}-1.21.4-

      - name: Build
        run: gradle build --no-daemon --stacktrace
        
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AetherHUD-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
